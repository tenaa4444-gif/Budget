<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Бюджет Т&amp;Д</title>
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Бюджет">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="theme-color" content="#F2F4F1" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#0F1512" media="(prefers-color-scheme: dark)">
<link rel="apple-touch-icon" href="icon-180.png">
<link rel="icon" href="icon-180.png">
<link rel="manifest" href="manifest.webmanifest">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Golos+Text:wght@400;500;600;700&family=Unbounded:wght@600;700&display=swap">
<style>
:root{
  --bg:#F2F4F1; --surface:#FFFFFF; --sunk:#E6EAE5; --line:#D5DBD3;
  --ink:#16201B; --muted:#5F6B64; --accent:#1F5C4A; --accent-ink:#FFFFFF;
  --inc:#1E7A4C; --warn:#B8741A; --bad:#B23A2E;
  --display:"Unbounded","Golos Text",system-ui,sans-serif;
  --body:"Golos Text",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
  color-scheme:light;
}
@media (prefers-color-scheme:dark){:root{
  --bg:#0F1512; --surface:#18201C; --sunk:#202A25; --line:#2C3832;
  --ink:#E8EEEA; --muted:#93A099; --accent:#6CC3A3; --accent-ink:#0B1310;
  --inc:#6CCB95; --warn:#E0A64F; --bad:#EE7B6E; color-scheme:dark}}
*{box-sizing:border-box}
html,body{background:var(--bg);margin:0}
body{color:var(--ink);font:15px/1.4 var(--body);font-variant-numeric:tabular-nums;-webkit-tap-highlight-color:transparent;-webkit-text-size-adjust:100%}
.wrap{max-width:560px;margin:0 auto;padding-inline:16px;padding-block:calc(12px + env(safe-area-inset-top,0px)) calc(130px + env(safe-area-inset-bottom,0px))}
button{font:inherit;color:inherit;cursor:pointer}
button:focus-visible,input:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
[hidden]{display:none!important}
.top{display:flex;align-items:center;justify-content:space-between;gap:8px}
.mbtn{background:var(--surface);border:1px solid var(--line);width:40px;height:40px;border-radius:12px;font-size:18px}
.mbtn:disabled{opacity:.35}
.mname{font:600 17px var(--body);text-align:center;flex:1}
.hero{margin-top:12px;padding:16px;background:var(--accent);color:var(--accent-ink);border-radius:18px;display:grid;gap:10px}
.hero .lab{font-size:12px;letter-spacing:.06em;text-transform:uppercase;opacity:.8}
.hero .bal{font:700 30px/1.1 var(--display);letter-spacing:-.01em}
.hero .row{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.hero .row b{display:block;font:600 17px var(--body)}
.banner{margin-top:12px;padding:12px 14px;border-radius:12px;background:var(--sunk);color:var(--muted);font-size:14px}
.banner.err{color:var(--bad)}
h2{font:600 13px var(--body);letter-spacing:.06em;text-transform:uppercase;color:var(--muted);margin:22px 0 8px}
.day{margin-top:18px}
.dayhead{display:flex;justify-content:space-between;align-items:baseline;color:var(--muted);font-size:13px;padding:0 4px 6px}
.dayhead span:first-child{font-weight:600;color:var(--ink)}
.list{background:var(--surface);border-radius:14px;border:1px solid var(--line);overflow:hidden}
.tx{display:grid;grid-template-columns:1fr auto;gap:2px 12px;padding:11px 14px;border:0;border-top:1px solid var(--line);background:none;width:100%;text-align:left}
.tx:first-child{border-top:0}
.tx .note{min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;font-weight:500}
.tx .amt{font-weight:600;white-space:nowrap}
.tx .amt.inc{color:var(--inc)}
.tx .meta{color:var(--muted);font-size:13px;grid-column:1/-1;display:flex;gap:6px;flex-wrap:wrap}
.who{display:inline-block;padding:0 7px;border-radius:99px;background:var(--sunk);font-size:12px;line-height:19px}
.empty{padding:28px 18px;text-align:center;color:var(--muted);background:var(--surface);border:1px dashed var(--line);border-radius:14px;margin-top:16px}
.fab{position:fixed;right:max(16px,calc(50% - 264px));bottom:calc(76px + env(safe-area-inset-bottom,0px));width:60px;height:60px;border-radius:20px;border:0;background:var(--accent);color:var(--accent-ink);font-size:30px;line-height:1;box-shadow:0 6px 18px rgba(0,0,0,.22);z-index:4}
.tabs{position:fixed;left:0;right:0;bottom:0;background:var(--surface);border-top:1px solid var(--line);display:grid;grid-template-columns:repeat(3,1fr);padding-bottom:env(safe-area-inset-bottom,0px);z-index:5}
.tabs button{border:0;background:none;padding:12px 4px 14px;font-size:13px;color:var(--muted);font-weight:500}
.tabs button[aria-current="page"]{color:var(--accent);font-weight:700}
.cat{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:12px 14px;display:grid;gap:7px}
.cats{display:grid;gap:8px}
.cat .r{display:flex;justify-content:space-between;gap:8px}
.cat .r span:first-child{font-weight:600;min-width:0}
.cat .r span:last-child{white-space:nowrap;color:var(--muted);font-size:14px}
.bar{height:8px;border-radius:99px;background:var(--sunk);overflow:hidden}
.bar i{display:block;height:100%;background:var(--accent);border-radius:99px}
.bar i.warn{background:var(--warn)}.bar i.bad{background:var(--bad)}
.over{color:var(--bad);font-size:13px;font-weight:600}
.people{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.pcard{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:12px 14px}
.pcard b{display:block;font-size:18px}
.pcard span{color:var(--muted);font-size:13px}
.scrim{position:fixed;inset:0;background:rgba(10,16,13,.45);z-index:10;display:flex;align-items:flex-end;justify-content:center}
.sheet{background:var(--bg);width:100%;max-width:560px;border-radius:20px 20px 0 0;padding:16px 16px calc(18px + env(safe-area-inset-bottom,0px));max-height:94%;overflow:auto;display:grid;gap:14px}
.sheet .grab{width:40px;height:4px;border-radius:9px;background:var(--line);margin:0 auto}
.seg{display:grid;grid-template-columns:1fr 1fr;background:var(--sunk);border-radius:12px;padding:3px}
.seg button{border:0;background:none;padding:9px;border-radius:10px;font-weight:600;color:var(--muted)}
.seg button[aria-pressed="true"]{background:var(--surface);color:var(--ink);box-shadow:0 1px 3px rgba(0,0,0,.12)}
.amtbox{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:10px 14px}
.amtbox input{width:100%;border:0;background:none;font:700 32px var(--display);color:var(--ink);outline:none;padding:2px 0}
.amtbox .hint{color:var(--muted);font-size:13px;min-height:18px}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chip{border:1px solid var(--line);background:var(--surface);border-radius:99px;padding:7px 12px;font-size:14px}
.chip[aria-pressed="true"]{background:var(--accent);border-color:var(--accent);color:var(--accent-ink);font-weight:600}
.quick{display:flex;gap:6px;overflow-x:auto;padding-bottom:2px;scrollbar-width:none}
.quick .chip{white-space:nowrap;flex:none}
.quick .chip small{color:var(--muted);margin-left:4px}
.field{display:grid;gap:5px}
.field label{font-size:13px;color:var(--muted);font-weight:500}
.field input{width:100%;border:1px solid var(--line);background:var(--surface);color:var(--ink);border-radius:12px;padding:11px 12px;font:inherit;font-size:16px;min-width:0}
.two{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.actions{display:flex;gap:8px}
.btn{flex:1;border:0;border-radius:14px;padding:14px;font-weight:700;font-size:16px;background:var(--accent);color:var(--accent-ink)}
.btn.ghost{background:var(--sunk);color:var(--ink);flex:0 0 auto;padding-inline:18px}
.btn.del{background:none;color:var(--bad);flex:0 0 auto;padding-inline:12px}
.btn:disabled{opacity:.5}
.small{font-size:13px;color:var(--muted)}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(150px + env(safe-area-inset-bottom,0px));background:var(--ink);color:var(--bg);padding:10px 16px;border-radius:12px;font-weight:600;z-index:20;max-width:calc(100% - 32px)}
.linkbtn{display:block;text-align:center;text-decoration:none;border:1px dashed var(--line);background:none;border-radius:12px;padding:12px;color:var(--accent);font-weight:600;width:100%}
.setup{display:grid;gap:12px;margin-top:16px}
@media (prefers-reduced-motion:no-preference){.sheet{animation:up .18s ease-out}@keyframes up{from{transform:translateY(24px);opacity:.6}}}
</style>
</head>
<body>
<div class="wrap">
  <div class="top">
    <button class="mbtn" id="prev" aria-label="Предыдущий месяц">‹</button>
    <div class="mname" id="mname"></div>
    <button class="mbtn" id="next" aria-label="Следующий месяц">›</button>
  </div>
  <div class="hero">
    <div><div class="lab">Остаток за месяц</div><div class="bal" id="bal">—</div></div>
    <div class="row"><div><span class="lab">Доходы</span><b id="inc">—</b></div><div><span class="lab">Расходы</span><b id="exp">—</b></div></div>
  </div>
  <div id="status" class="banner" hidden></div>
  <main id="view"></main>
</div>
<button class="fab" id="fab" aria-label="Добавить операцию">+</button>
<nav class="tabs">
  <button data-tab="list" aria-current="page">Операции</button>
  <button data-tab="budget">Бюджет</button>
  <button data-tab="settings">Настройки</button>
</nav>
<div id="sheetHost"></div>
<div id="toastHost"></div>

<script>
const MONTHS=['Январь','Февраль','Март','Апрель','Май','Июнь','Июль','Август','Сентябрь','Октябрь','Ноябрь','Декабрь'];
const MONTHS_GEN=['января','февраля','марта','апреля','мая','июня','июля','августа','сентября','октября','ноября','декабря'];
const WD=['вс','пн','вт','ср','чт','пт','сб'];
const $=s=>document.querySelector(s);
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const fmt=n=>(Math.round((n||0)*100)/100).toLocaleString('ru-RU',{maximumFractionDigits:2})+' ₸';
const pad=n=>String(n).padStart(2,'0');
const todayStr=()=>{const d=new Date();return d.getFullYear()+'-'+pad(d.getMonth()+1)+'-'+pad(d.getDate())};
const ls={get(k,d){try{const v=localStorage.getItem(k);return v==null?d:JSON.parse(v)}catch(e){return d}},set(k,v){try{localStorage.setItem(k,JSON.stringify(v))}catch(e){}}};

/* Безопасный калькулятор: цифры, пробелы, + - * / ( ) и запятая/точка */
function calc(s){
  s=String(s||'').replace(/\s/g,'').replace(/,/g,'.').replace(/^=/,'').replace(/[×х]/g,'*');
  if(!s)return null; if(!/^[0-9+\-*/().]+$/.test(s))return NaN;
  let i=0;const peek=()=>s[i];
  function num(){if(peek()==='('){i++;const v=expr();if(s[i]!==')')throw 0;i++;return v}
    if(peek()==='-'){i++;return -num()} const m=/^\d*\.?\d+|^\d+\.?/.exec(s.slice(i));if(!m)throw 0;i+=m[0].length;return parseFloat(m[0])}
  function term(){let v=num();while(peek()==='*'||peek()==='/'){const o=s[i++];const r=num();v=o==='*'?v*r:v/r}return v}
  function expr(){let v=term();while(peek()==='+'||peek()==='-'){const o=s[i++];const r=term();v=o==='+'?v+r:v-r}return v}
  try{const v=expr();if(i!==s.length||!isFinite(v))return NaN;return Math.round(v*100)/100}catch(e){return NaN}
}

const conn=ls.get('conn',{url:'',key:''});
const state={month:todayStr().slice(0,7),rows:null,cfg:ls.get('cfg',null),frequent:ls.get('freq',[]),tab:ls.get('tab','list'),who:ls.get('who','Тенгиз'),busy:false};
const cache=ls.get('months',{});
if(cache[state.month])state.rows=cache[state.month];

/* ---------- API (Google Apps Script) ---------- */
async function api(action,params={},post=false){
  if(!conn.url||!conn.key)throw new Error('Нет подключения');
  let res;
  if(post){res=await fetch(conn.url,{method:'POST',headers:{'Content-Type':'text/plain;charset=utf-8'},body:JSON.stringify({k:conn.key,action,...params})})}
  else{const q=new URLSearchParams({k:conn.key,action,...params});res=await fetch(conn.url+(conn.url.includes('?')?'&':'?')+q)}
  const data=await res.json();
  if(!data.ok)throw new Error(data.error||'Ошибка таблицы');
  return data;
}
function applyMonth(m){if(!m)return;cache[m.ym]=m.rows;ls.set('months',cache);if(m.ym===state.month){state.rows=m.rows}}

async function init(){
  if(!conn.url||!conn.key){state.tab='settings';render();return}
  setStatus(state.rows?'Обновляю…':'Загружаю из таблицы…');
  try{
    const d=await api('init',{month:state.month});
    state.cfg={expense:d.expense,income:d.income,people:d.people,year:d.year,sheetUrl:d.sheetUrl};
    state.frequent=d.frequent||[];ls.set('cfg',state.cfg);ls.set('freq',state.frequent);
    applyMonth(d.month);setStatus(null);
  }catch(e){setStatus(errText(e),true)}
  render();
}
async function loadMonth(){
  state.rows=cache[state.month]||null;render();
  setStatus(state.rows?null:'Загружаю…');
  try{const d=await api('month',{month:state.month});applyMonth(d.month);setStatus(null)}catch(e){setStatus(errText(e),true)}
  render();
}
function errText(e){const m=String(e&&e.message||e);if(/Failed to fetch|NetworkError|Load failed/i.test(m))return 'Нет связи с таблицей. Проверьте интернет и адрес скрипта.';return m}

function setStatus(msg,err){const el=$('#status');if(!msg){el.hidden=true;return}el.hidden=false;el.textContent=msg;el.classList.toggle('err',!!err)}
function toast(msg){const h=$('#toastHost');h.innerHTML='<div class="toast" role="status">'+esc(msg)+'</div>';clearTimeout(toast.t);toast.t=setTimeout(()=>h.innerHTML='',2400)}
const cfg=()=>state.cfg||{expense:[],income:[],people:['Тенгиз','Дамели'],year:+todayStr().slice(0,4)};

function monthLabel(m){const [y,mm]=m.split('-');return MONTHS[+mm-1]+' '+y}
function shiftMonth(d){let [y,m]=state.month.split('-').map(Number);m+=d;if(m<1){m=12;y--}if(m>12){m=1;y++}
  if(state.cfg&&y!==state.cfg.year)return;state.month=y+'-'+pad(m);loadMonth()}

function render(){
  $('#mname').textContent=monthLabel(state.month);
  const [y,m]=state.month.split('-').map(Number);const yr=cfg().year;
  $('#prev').disabled=!!state.cfg&&y===yr&&m===1;$('#next').disabled=!!state.cfg&&y===yr&&m===12;
  const rows=state.rows||[];let inc=0,exp=0;for(const t of rows){if(t.type==='inc')inc+=t.amount;else exp+=t.amount}
  const known=!!state.rows;
  $('#inc').textContent=known?fmt(inc):'—';$('#exp').textContent=known?fmt(exp):'—';$('#bal').textContent=known?(inc-exp<0?'−':'')+fmt(Math.abs(inc-exp)):'—';
  document.querySelectorAll('.tabs button').forEach(b=>b.setAttribute('aria-current',b.dataset.tab===state.tab?'page':'false'));
  $('#fab').hidden=state.tab==='settings'||!state.cfg;
  const v=$('#view');
  v.innerHTML=state.tab==='list'?renderList():state.tab==='budget'?renderBudget():renderSettings();
}

function renderList(){
  if(!state.rows)return '';
  if(!state.rows.length)return '<div class="empty"><b>В этом месяце пока пусто</b><br>Нажмите «+» внизу справа, чтобы добавить первую трату или доход.</div>';
  const by={};for(const t of state.rows)(by[t.date]=by[t.date]||[]).push(t);
  return Object.keys(by).sort().reverse().map(d=>{
    const items=by[d].sort((a,b)=>b.row-a.row);
    const dt=new Date(d+'T00:00:00');const dayExp=items.filter(t=>t.type!=='inc').reduce((s,t)=>s+t.amount,0);
    const lab=(d===todayStr()?'Сегодня, ':'')+dt.getDate()+' '+MONTHS_GEN[dt.getMonth()]+', '+WD[dt.getDay()];
    return '<section class="day"><div class="dayhead"><span>'+lab+'</span><span>'+(dayExp?'−'+fmt(dayExp):'')+'</span></div><div class="list">'+
      items.map(t=>'<button class="tx" data-row="'+t.row+'"><span class="note">'+esc(t.note||t.cat)+'</span><span class="amt '+(t.type==='inc'?'inc':'')+'">'+(t.type==='inc'?'+':'−')+fmt(t.amount)+'</span><span class="meta"><span>'+esc(t.cat)+'</span>'+(t.who?'<span class="who">'+esc(t.who)+'</span>':'')+'</span></button>').join('')+
      '</div></section>';
  }).join('');
}

function renderBudget(){
  const c=cfg();const rows=state.rows||[];const sums={},isums={},per={};
  for(const t of rows){if(t.type==='inc')isums[t.cat]=(isums[t.cat]||0)+t.amount;else{sums[t.cat]=(sums[t.cat]||0)+t.amount;if(t.who)per[t.who]=(per[t.who]||0)+t.amount}}
  const lim=(arr,n)=>(arr.find(e=>e.name.toLowerCase()===n.toLowerCase())||{}).limit||0;
  const card=(name,spent,limit)=>{const p=limit?spent/limit:0;const cls=p>1?'bad':p>.85?'warn':'';
    return '<div class="cat"><div class="r"><span>'+esc(name)+'</span><span>'+fmt(spent)+(limit?' из '+fmt(limit):'')+'</span></div>'+
    (limit?'<div class="bar"><i class="'+cls+'" style="width:'+Math.min(100,p*100).toFixed(1)+'%"></i></div>'+(p>1?'<div class="over">Перерасход '+fmt(spent-limit)+'</div>':''):'')+'</div>'};
  const names=[...new Set([...c.expense.map(e=>e.name),...Object.keys(sums)])].filter(n=>sums[n]||lim(c.expense,n));
  const totalB=c.expense.reduce((s,e)=>s+e.limit,0),totalS=Object.values(sums).reduce((a,b)=>a+b,0);
  let h='<h2>Расходы по категориям</h2><div class="cats">'+card('Всего',totalS,totalB)+names.sort((a,b)=>(sums[b]||0)-(sums[a]||0)).map(n=>card(n,sums[n]||0,lim(c.expense,n))).join('')+'</div>';
  if(Object.keys(per).length)h+='<h2>Кто сколько потратил</h2><div class="people">'+c.people.map(p=>'<div class="pcard"><span>'+esc(p)+'</span><b>'+fmt(per[p]||0)+'</b></div>').join('')+'</div><p class="small">Считаются только записи, где отмечено, кто платил.</p>';
  const inames=[...new Set([...c.income.map(e=>e.name),...Object.keys(isums)])].filter(n=>isums[n]||lim(c.income,n));
  if(inames.length)h+='<h2>Доходы</h2><div class="cats">'+inames.map(n=>card(n,isums[n]||0,lim(c.income,n))).join('')+'</div>';
  h+='<p class="small" style="margin-top:14px">Категории и лимиты меняются на листе «Категории» в Google Таблице.</p>';
  return h;
}

function renderSettings(){
  const connected=!!state.cfg&&conn.url&&conn.key;
  return '<form class="setup" id="setup" autocomplete="off">'+
    (connected?'':'<div class="banner">Чтобы начать, вставьте адрес скрипта из Google Таблицы и пароль, который вы задали в скрипте.</div>')+
    '<div class="field"><label for="s-url">Адрес веб-приложения (Apps Script)</label><input id="s-url" inputmode="url" placeholder="https://script.google.com/macros/s/…/exec" value="'+esc(conn.url)+'"></div>'+
    '<div class="field"><label for="s-key">Пароль</label><input id="s-key" type="password" value="'+esc(conn.key)+'"></div>'+
    '<button class="btn" type="submit" id="s-save">'+(connected?'Сохранить и переподключиться':'Подключить')+'</button>'+
    (state.cfg&&state.cfg.sheetUrl?'<a class="linkbtn" href="'+esc(state.cfg.sheetUrl)+'" target="_blank" rel="noopener">Открыть Google Таблицу</a>':'')+
    '</form>';
}

/* ---------- Форма добавления / редактирования ---------- */
let form=null;
function openSheet(tx){
  form=tx?{row:tx.row,origMonth:state.month,origAmount:tx.amount,type:tx.type,amountStr:tx.expr||String(tx.amount),cat:tx.cat,note:tx.note||'',date:tx.date,who:tx.who||''}
    :{row:null,type:'exp',amountStr:'',cat:'',note:'',date:state.month===todayStr().slice(0,7)?todayStr():state.month+'-01',who:state.who};
  drawSheet();if(!tx)setTimeout(()=>{const a=$('#f-amt');if(a)a.focus()},80);
}
function hintFor(s){const v=calc(s);if(!s)return 'Можно писать выражение: 1760-1280';if(isNaN(v))return 'Только цифры и + − × /';return /[+\-*/]/.test(s.replace(/^-/,''))?'= '+fmt(v):''}
function drawSheet(){
  const c=cfg();const cats=(form.type==='inc'?c.income:c.expense).map(e=>e.name);
  if(form.cat&&!cats.includes(form.cat))cats.push(form.cat);
  const fr=form.row?[]:state.frequent.filter(t=>t.type===form.type);
  $('#sheetHost').innerHTML='<div class="scrim" id="scrim"><form class="sheet" id="sheet" autocomplete="off"><div class="grab"></div>'+
    '<div class="seg"><button type="button" data-type="exp" aria-pressed="'+(form.type==='exp')+'">Расход</button><button type="button" data-type="inc" aria-pressed="'+(form.type==='inc')+'">Доход</button></div>'+
    (fr.length?'<div class="field"><label>Частые</label><div class="quick">'+fr.map((t,i)=>'<button type="button" class="chip" data-fr="'+i+'">'+esc(t.note)+'<small>'+fmt(t.amount)+'</small></button>').join('')+'</div></div>':'')+
    '<div class="amtbox"><input id="f-amt" inputmode="decimal" placeholder="0 ₸" value="'+esc(form.amountStr)+'" aria-label="Сумма"><div class="hint" id="f-hint">'+esc(hintFor(form.amountStr))+'</div></div>'+
    '<div class="field"><label>Категория</label><div class="chips">'+cats.map(n=>'<button type="button" class="chip" data-cat="'+esc(n)+'" aria-pressed="'+(form.cat===n)+'">'+esc(n)+'</button>').join('')+'</div></div>'+
    '<div class="field"><label for="f-note">Комментарий</label><input id="f-note" value="'+esc(form.note)+'" placeholder="Например: обед Галмарт"></div>'+
    '<div class="two"><div class="field"><label for="f-date">Дата</label><input type="date" id="f-date" value="'+form.date+'"></div>'+
    '<div class="field"><label>Кто</label><div class="chips">'+c.people.map(p=>'<button type="button" class="chip" data-who="'+esc(p)+'" aria-pressed="'+(form.who===p)+'">'+esc(p)+'</button>').join('')+'</div></div></div>'+
    '<div class="actions">'+(form.row?'<button type="button" class="btn del" id="f-del">Удалить</button>':'<button type="button" class="btn ghost" id="f-cancel">Отмена</button>')+'<button type="submit" class="btn" id="f-save">'+(form.row?'Сохранить':'Добавить')+'</button></div>'+
    '</form></div>';
  form._fr=fr;
}
function closeSheet(){$('#sheetHost').innerHTML='';form=null}
async function saveForm(){
  if(state.busy)return;
  const amount=calc(form.amountStr);
  if(amount==null||isNaN(amount)||amount<=0){toast('Введите сумму');return}
  if(!form.cat){toast('Выберите категорию');return}
  if(!/^\d{4}-\d{2}-\d{2}$/.test(form.date)){toast('Укажите дату');return}
  if(+form.date.slice(0,4)!==cfg().year){toast('В таблице есть только '+cfg().year+' год');return}
  const p={date:form.date,type:form.type,cat:form.cat,amount:form.amountStr,note:form.note.trim(),who:form.who||'',view:form.date.slice(0,7)};
  if(form.row)Object.assign(p,{row:form.row,origMonth:form.origMonth,origAmount:form.origAmount});
  const btn=$('#f-save');btn.disabled=true;btn.textContent='Сохраняю…';state.busy=true;
  try{
    const d=await api(form.row?'update':'add',p,true);
    if(form.who){state.who=form.who;ls.set('who',form.who)}
    const msg=form.row?'Сохранено':'Добавлено: '+fmt(amount);
    if(d.month&&d.month.ym!==state.month)state.month=d.month.ym;
    applyMonth(d.month);closeSheet();render();toast(msg);
  }catch(e){btn.disabled=false;btn.textContent=form.row?'Сохранить':'Добавить';toast(errText(e))}
  state.busy=false;
}
let delArmed=false;
async function deleteTx(){
  const b=$('#f-del');if(!delArmed){delArmed=true;b.textContent='Точно удалить?';setTimeout(()=>{delArmed=false;if(b.isConnected)b.textContent='Удалить'},3000);return}
  delArmed=false;b.disabled=true;
  try{const d=await api('delete',{row:form.row,origMonth:form.origMonth,origAmount:form.origAmount,view:state.month},true);applyMonth(d.month);closeSheet();render();toast('Удалено')}
  catch(e){b.disabled=false;toast(errText(e))}
}

/* ---------- События ---------- */
$('#prev').onclick=()=>shiftMonth(-1);$('#next').onclick=()=>shiftMonth(1);
$('#fab').onclick=()=>openSheet(null);
document.querySelector('.tabs').onclick=e=>{const b=e.target.closest('button');if(!b)return;state.tab=b.dataset.tab;ls.set('tab',state.tab);render();window.scrollTo(0,0)};
$('#view').addEventListener('click',e=>{const tx=e.target.closest('.tx');if(tx)openSheet((state.rows||[]).find(t=>t.row===+tx.dataset.row))});
$('#view').addEventListener('submit',e=>{
  e.preventDefault();
  conn.url=$('#s-url').value.trim();conn.key=$('#s-key').value;ls.set('conn',conn);
  state.cfg=null;state.tab='list';ls.set('tab','list');init();
});
$('#sheetHost').addEventListener('click',e=>{
  if(e.target.id==='scrim'){closeSheet();return}
  const b=e.target.closest('button');if(!b||!form)return;
  if(b.dataset.type){form.type=b.dataset.type;form.cat='';drawSheet()}
  else if(b.dataset.cat){form.cat=b.dataset.cat;drawSheet()}
  else if(b.dataset.who){form.who=form.who===b.dataset.who?'':b.dataset.who;drawSheet()}
  else if(b.dataset.fr){const t=form._fr[+b.dataset.fr];form.amountStr=String(t.amount);form.cat=t.cat;form.note=t.note;drawSheet()}
  else if(b.id==='f-cancel')closeSheet();
  else if(b.id==='f-del')deleteTx();
});
$('#sheetHost').addEventListener('input',e=>{
  if(!form)return;const t=e.target;
  if(t.id==='f-amt'){form.amountStr=t.value;$('#f-hint').textContent=hintFor(t.value)}
  if(t.id==='f-note')form.note=t.value;
  if(t.id==='f-date')form.date=t.value;
});
$('#sheetHost').addEventListener('submit',e=>{e.preventDefault();saveForm()});
document.addEventListener('visibilitychange',()=>{if(document.visibilityState==='visible'&&state.cfg)loadMonth()});

render();init();
</script>
</body>
</html>
